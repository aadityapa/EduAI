name: Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: "Skip pre-deploy tests (emergency only)"
        type: boolean
        default: false

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: eduai-staging-eks
  K8S_NAMESPACE: eduai-staging
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  build-and-test:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_tests != true }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduai
          POSTGRES_PASSWORD: eduai_dev
          POSTGRES_DB: eduai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://eduai:eduai_dev@localhost:5432/eduai?schema=public
      JWT_SECRET: ci-test-secret-minimum-32-characters
      AUTH_SECRET: ci-auth-secret-minimum-32-characters
      OTEL_SDK_DISABLED: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run migrations
        run: pnpm --filter @eduai/database exec prisma migrate deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  deploy-staging:
    needs: build-and-test
    if: |
      always() &&
      (needs.build-and-test.result == 'success' || needs.build-and-test.result == 'skipped') &&
      secrets.AWS_DEPLOY_ROLE_ARN != '' &&
      secrets.AWS_ACCOUNT_ID != '' &&
      (github.event_name != 'workflow_dispatch' || inputs.target == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read

    strategy:
      matrix:
        service:
          - identity-service
          - learning-service
          - ai-service
          - erp-service
          - billing-service
          - web
          - admin

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push service image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [[ "${{ matrix.service }}" == "web" || "${{ matrix.service }}" == "admin" ]]; then
            docker build \
              -f backend/infrastructure/docker/Dockerfile.next.prod \
              --build-arg APP_NAME=${{ matrix.service }} \
              -t $ECR_REGISTRY/eduai/${{ matrix.service }}:$IMAGE_TAG \
              -t $ECR_REGISTRY/eduai/${{ matrix.service }}:latest-staging \
              .
          else
            docker build \
              -f backend/infrastructure/docker/Dockerfile.prod \
              --build-arg SERVICE_NAME=${{ matrix.service }} \
              -t $ECR_REGISTRY/eduai/${{ matrix.service }}:$IMAGE_TAG \
              -t $ECR_REGISTRY/eduai/${{ matrix.service }}:latest-staging \
              .
          fi
          docker push $ECR_REGISTRY/eduai/${{ matrix.service }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/eduai/${{ matrix.service }}:latest-staging

  apply-kubernetes-staging:
    needs: deploy-staging
    if: ${{ secrets.AWS_DEPLOY_ROLE_ARN != '' && secrets.AWS_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region $AWS_REGION

      - name: Record previous revision (rollback)
        id: prev
        run: |
          echo "identity=$(kubectl get deployment identity-service -n $K8S_NAMESPACE -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}' 2>/dev/null || echo 0)" >> $GITHUB_OUTPUT

      - name: Apply Kubernetes manifests
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          for manifest in backend/infrastructure/kubernetes/*.yaml; do
            envsubst < "$manifest" | kubectl apply -f -
          done

      - name: Wait for rollout
        id: rollout
        run: |
          set -e
          kubectl rollout status deployment/identity-service -n $K8S_NAMESPACE --timeout=5m
          kubectl rollout status deployment/learning-service -n $K8S_NAMESPACE --timeout=5m
          kubectl rollout status deployment/web -n $K8S_NAMESPACE --timeout=5m

      - name: Automatic rollback on failed health
        if: failure()
        run: |
          echo "Rollout or smoke failed — rolling back identity/learning/web"
          kubectl rollout undo deployment/identity-service -n $K8S_NAMESPACE || true
          kubectl rollout undo deployment/learning-service -n $K8S_NAMESPACE || true
          kubectl rollout undo deployment/web -n $K8S_NAMESPACE || true
          kubectl rollout status deployment/identity-service -n $K8S_NAMESPACE --timeout=3m || true

      - name: Smoke test staging
        run: |
          kubectl run smoke-test --rm -i --restart=Never -n $K8S_NAMESPACE \
            --image=curlimages/curl:8.10.1 -- \
            sh -c '
              curl -fsS http://identity-service:3001/api/v1/health &&
              curl -fsS http://learning-service:3003/api/v1/health &&
              curl -fsS http://web:3000/
            '

  deploy-production:
    needs: [build-and-test, apply-kubernetes-staging]
    if: |
      always() &&
      needs.apply-kubernetes-staging.result == 'success' &&
      secrets.AWS_DEPLOY_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    runs-on: ubuntu-latest
    environment:
      name: production
      # GitHub Environment protection rules: require reviewers before this job runs
    permissions:
      id-token: write
      contents: read
    env:
      EKS_CLUSTER_NAME: eduai-prod-eks
      K8S_NAMESPACE: eduai-prod

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig (prod)
        run: aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region $AWS_REGION

      - name: Gate migrations
        run: |
          echo "Apply Prisma migrations via documented runbook before image cutover."
          echo "See backend/docs/operations/runbooks/deploy-rollback.md"

      - name: Apply prod manifests
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          for manifest in backend/infrastructure/kubernetes/*.yaml; do
            envsubst < "$manifest" | kubectl apply -f -
          done

      - name: Wait for prod rollout
        run: |
          kubectl rollout status deployment/identity-service -n $K8S_NAMESPACE --timeout=8m
          kubectl rollout status deployment/web -n $K8S_NAMESPACE --timeout=8m

      - name: Rollback on failure
        if: failure()
        run: |
          kubectl rollout undo deployment/identity-service -n $K8S_NAMESPACE || true
          kubectl rollout undo deployment/web -n $K8S_NAMESPACE || true
